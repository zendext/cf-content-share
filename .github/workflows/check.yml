name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install Rust toolchain
        run: rustup show
      - name: Install dependencies
        run: |
          npm ci
          cargo install worker-build --version 0.8.7 --locked
      - name: Check formatting, lint, types and behavior
        run: npm run check
      - name: Validate local deployment bundle
        run: npm run dry-run
